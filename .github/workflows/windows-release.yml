name: Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version."
          }

      - name: Set up Node for the interface build
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the bundled React interface
        working-directory: web
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "Web dependency installation failed with exit code $LASTEXITCODE." }
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { throw "Desktop bridge checks failed with exit code $LASTEXITCODE." }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Web build failed with exit code $LASTEXITCODE." }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller huggingface-hub

      - name: Check desktop host and native language adapters
        shell: pwsh
        run: |
          python -m unittest test_desktop_host test_native_languages -v
          if ($LASTEXITCODE -ne 0) { throw "Desktop checks failed with exit code $LASTEXITCODE." }

      - name: Download the offline Whisper model
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP "whisper-small-download"
          $bundle = Join-Path $env:GITHUB_WORKSPACE "build-assets\whisper-small"
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='Systran/faster-whisper-small', local_dir=r'$download', allow_patterns=['config.json','preprocessor_config.json','model.bin','tokenizer.json','vocabulary.json','vocabulary.*'])"
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Get-ChildItem -LiteralPath $download -File | Copy-Item -Destination $bundle
          if (-not (Test-Path (Join-Path $bundle "model.bin"))) { throw "Whisper model payload is missing." }

      - name: Download and verify offline Microsoft WebView2 runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build-assets -Force | Out-Null
          $runtime = Join-Path $env:GITHUB_WORKSPACE 'build-assets\MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile $runtime
          $signature = Get-AuthenticodeSignature -LiteralPath $runtime
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation(?:,|$)') {
            throw 'The WebView2 installer does not have a valid Microsoft Authenticode signature.'
          }
          Get-FileHash -LiteralPath $runtime -Algorithm SHA256 | Format-List

      - name: Package desktop app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean BouAssistant.spec
          if ($LASTEXITCODE -ne 0) { throw "App packaging failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path 'dist\BouAssistant\_internal\web\dist\index.html')) {
            throw 'The React interface is missing from the desktop bundle.'
          }

      - name: Build self-extracting setup executable
        shell: pwsh
        run: |
          $payload = (Resolve-Path "dist\BouAssistant").Path
          $runtime = (Resolve-Path 'build-assets\MicrosoftEdgeWebView2RuntimeInstallerX64.exe').Path
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name Bou-AI-Assistant-Setup `
            --collect-all comtypes --hidden-import comtypes.client --hidden-import comtypes.client.dynamic `
            --add-data "$payload;payload" --add-data "$runtime;prerequisites" `
            --distpath dist-installer --workpath build-installer --specpath build-installer `
            installer\installer.py
          if ($LASTEXITCODE -ne 0) { throw "Setup packaging failed with exit code $LASTEXITCODE." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bou-AI-Assistant-Windows-x64
          path: dist-installer/Bou-AI-Assistant-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = Get-Item -LiteralPath "dist-installer\Bou-AI-Assistant-Setup.exe" -ErrorAction SilentlyContinue
          if (-not $installer) { throw "Installer asset was not created." }
          gh release create "$env:GITHUB_REF_NAME" $installer.FullName --title "Bou AI Assistant $env:GITHUB_REF_NAME" --notes-file README-BN.md
